[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose = "1.11.2"
material3 = "1.4.0"
miuix = "0.9.3"
coui = "1.1.0"
activity = "1.12.4"
lifecycle = "2.10.0"
datastore = "1.2.1"
coil = "2.7.0"
espresso = "3.7.0"

[libraries]
coui-ui = { module = "io.github.suqi8.coui.kmp:coui-ui", version.ref = "coui" }
coui-preference = { module = "io.github.suqi8.coui.kmp:coui-preference", version.ref = "coui" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
miuix-icons = { module = "top.yukonga.miuix.kmp:miuix-icons-android", version.ref = "miuix" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
miuix-ui = { module = "top.yukonga.miuix.kmp:miuix-ui-android", version.ref = "miuix" }
miuix-blur = { module = "top.yukonga.miuix.kmp:miuix-blur-android", version.ref = "miuix" }
miuix-preference = { module = "top.yukonga.miuix.kmp:miuix-preference-android", version.ref = "miuix" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
junit = { module = "junit:junit", version = "4.13.2" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
test-json = { module = "org.json:json", version = "20251224" }
test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

