services:
  netease:
    build: .
    command: ["node", "node_modules/@neteasecloudmusicapienhanced/api/app.js"]
    restart: unless-stopped
    expose: ["3000"]
    environment:
      ENABLE_GENERAL_UNBLOCK: "false"
  qq:
    build: .
    command: ["node", "node_modules/@yakult-green-tea/qq-music-api/dist/src/app.js"]
    restart: unless-stopped
    expose: ["3000"]
    environment:
      QQ_SESSION_SECRET: ${QQ_SESSION_SECRET:?Set QQ_SESSION_SECRET in .env}
      QQ_AUTH_STATE_PATH: /app/.auth-state/qq-device.json
      QQ_AUTH_SESSION_PATH: /app/.auth-state/qq-sessions.json
    volumes:
      - qq-state:/app/.auth-state
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      MUSIC_API_HOST: ${MUSIC_API_HOST:?Set MUSIC_API_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [netease, qq]
volumes:
  qq-state:
  caddy-data:
  caddy-config:
